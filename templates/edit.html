{% extends 'layout.html' %}

{% block content %}
<div class="container mt-5">
    <!-- Welcome Section -->
    <div class="text-center mb-5">
        <h1 class="display-3 fw-bold text-primary">음원 편집</h1>
        <p class="lead text-secondary">자신이 생성한 결과물을 업로드하고 편집 효과를 줄 수 있습니다.</p>
    </div>

    <link href="static/dropzone.css" rel="stylesheet">

    <!-- form -->
    <div class="text-center justify-content-sm-center" style="height:100%; margin-top: 9rem; margin-bottom: 9rem;">
        <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
            <form method="POST" action="/edit_finish" enctype="multipart/form-data" id="submitForm">
                <div class="drop-zone">
                    <span class="drop-zone__prompt">클릭 또는 Drag&Drop 하세요</span>
                    <input type="file" name="file" class="drop-zone__input" required>
                </div>
                </br></br>

                <!-- 추가 입력 필드 -->
                <div class="mb-3">
                    <label for="start_time" class="form-label">시작 시간 (밀리초 단위)</label>
                    <input type="number" class="form-control" id="start_time" name="start_time" required>
                </div>

                <div class="mb-3">
                    <label for="end_time" class="form-label">종료 시간 (밀리초 단위)</label>
                    <input type="number" class="form-control" id="end_time" name="end_time" required>
                </div>

                <div class="mb-3">
                    <label for="volume_change" class="form-label">볼륨 조절 (dB)</label>
                    <input type="number" class="form-control" id="volume_change" name="volume_change" required>
                </div>

                <div class="mb-3">
                    <label for="fade_in_time" class="form-label">페이드 인 시간 (밀리초 단위)</label>
                    <input type="number" class="form-control" id="fade_in_time" name="fade_in_time" required>
                </div>

                <div class="mb-3">
                    <label for="fade_out_time" class="form-label">페이드 아웃 시간 (밀리초 단위)</label>
                    <input type="number" class="form-control" id="fade_out_time" name="fade_out_time" required>
                </div>

                <button class="btn btn-primary btn-lg px-4 me-sm-3" id='smt' type="submit">확인</button>
                <button class="btn btn-outline-danger btn-lg px-4" id='rst' onClick="location.href=''" type='reset'>취소</button>
            </form>
        </div>
        <p class="lead text-secondary" style="font-size: 20px;">
        </br>
        </br>여기에서 편집할 음원 파일(.wav)을 업로드할 수 있습니다.
        </br>업로드 가능한 파일의 최대 크기는 1GB입니다.
        </p>
    </div>

    <script src="{{ url_for('static', filename='style.js') }}"></script>
    <script src="static/index.js"></script>
</div>
{% endblock %}
